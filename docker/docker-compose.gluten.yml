# Optional overlay for Module 06 Gluten demo.
# Usage: make up-gluten
#
# Note: Gluten preview builds exclude Iceberg. This profile runs a separate
# Parquet-based benchmark without Iceberg catalog extensions.

services:
  spark-master:
    environment:
      SPARK_PLUGINS: org.apache.gluten.GlutenPlugin
      SPARK_GLUTEN_ENABLED: "true"
    volumes:
      - gluten-jars:/opt/spark/gluten

  spark-worker-1:
    environment:
      SPARK_PLUGINS: org.apache.gluten.GlutenPlugin
      SPARK_GLUTEN_ENABLED: "true"
    volumes:
      - gluten-jars:/opt/spark/gluten

  spark-worker-2:
    environment:
      SPARK_PLUGINS: org.apache.gluten.GlutenPlugin
      SPARK_GLUTEN_ENABLED: "true"
    volumes:
      - gluten-jars:/opt/spark/gluten

  jupyter-lab:
    environment:
      SPARK_PLUGINS: org.apache.gluten.GlutenPlugin
      SPARK_GLUTEN_ENABLED: "true"
      SPARK_GLUTEN_LIB_PATH: /opt/spark/gluten
    volumes:
      - gluten-jars:/opt/spark/gluten

  gluten-init:
    image: curlimages/curl:latest
    profiles: ["gluten"]
    volumes:
      - gluten-jars:/opt/spark/gluten
    entrypoint: >
      /bin/sh -c "
        echo 'Gluten 1.7.0 for Spark 4.1 must be downloaded manually.';
        echo 'See 06-java-gc-gluten/README.md for setup instructions.';
        echo 'Place the Gluten JAR and native libs in the gluten-jars volume.';
        exit 0;
      "

volumes:
  gluten-jars:
