# Spark Workshop defaults
spark.master                     spark://spark-master:7077
spark.driver.host                jupyter-lab
spark.driver.bindAddress         0.0.0.0
spark.ui.port                    4040
spark.ui.bindAddress             0.0.0.0
spark.ui.showConsoleProgress     true

# Memory (driver in jupyter-lab; bump driver for large file listings / Iceberg metadata)
spark.driver.memory              4g
spark.executor.memory            2g
spark.executor.cores             2
spark.executor.instances         2

# Adaptive Query Execution
spark.sql.adaptive.enabled                           true
spark.sql.adaptive.coalescePartitions.enabled        true
spark.sql.adaptive.skewJoin.enabled                  true

# Iceberg catalog
spark.sql.extensions                                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.local                              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type                         hadoop
spark.sql.catalog.local.warehouse                    /workspace/data/output/warehouse
spark.sql.defaultCatalog                             local

# Event log (useful for UI history)
spark.eventLog.enabled                               true
spark.eventLog.dir                                   /workspace/data/output/spark-events

# SPJ defaults (module 05 enables explicitly; safe defaults here)
spark.sql.sources.v2.bucketing.enabled               true
spark.sql.sources.v2.bucketing.pushPartValues.enabled true
